# Robot notifiche The Rimineser F.P. su Cloudflare Workers (piano gratuito).
# Si pubblica da solo con .github/workflows/worker.yml a ogni modifica di worker/ su main.
name = "rimineser-notifiche"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
LEAGUE_URL = "https://raw.githubusercontent.com/therimineser/rimineser/main/docs/campionato.json"
EXAMPLE_URL = "https://raw.githubusercontent.com/therimineser/rimineser/main/tools/esempio-notifica.json"

[observability]
enabled = true
