name: Aggiorna campionato UISP e pubblica l'app

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: uisp
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.pubblica.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Controllo rapido sito UISP
        id: check
        run: python3 tools/uisp_update.py --check
      # calendario completo caricato dall'app (Calendario → "Carica calendario UISP"): testo salvato in Firestore uploads/calendar
      - name: Controllo calendario caricato dall'app
        id: cal
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          python3 -m pip install -q --disable-pip-version-check --user --break-system-packages google-auth requests 2>/dev/null \
            || python3 -m pip install -q --disable-pip-version-check --user google-auth requests
          python3 tools/uisp_calendar.py --check || echo "new=false" >> "$GITHUB_OUTPUT"
      - name: Leggi il calendario caricato dall'app
        if: steps.cal.outputs.new == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python3 tools/uisp_calendar.py
      - name: Strumenti per leggere i PDF
        if: steps.check.outputs.new == 'true'
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python3 -m pip install -q --user --break-system-packages pypdf 2>/dev/null || python3 -m pip install -q --user pypdf
      - name: Leggi i comunicati UISP
        if: steps.check.outputs.new == 'true'
        run: python3 tools/uisp_update.py
      - name: Salva se ci sono novità
        id: pubblica
        run: |
          if git diff --quiet docs/campionato.json; then
            echo "Nessuna novità"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Robot Rimineser"
            git config user.email "robot@users.noreply.github.com"
            git add docs/campionato.json
            git commit -m "Campionato aggiornato (comunicato o calendario UISP)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sveglia il robot delle notifiche
        if: steps.pubblica.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notifiche.yml --ref main || echo "robot notifiche non attivo"

  pubblica-app:
    needs: aggiorna
    if: needs.aggiorna.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
