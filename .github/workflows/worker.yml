name: Robot notifiche Cloudflare

# Pubblica worker/ su Cloudflare Workers (piano gratuito) e gli passa la chiave Firebase.
# Segreti del repository necessari: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (e FIREBASE_SA, già presente).
# Al primo avvio scrive da solo l'indirizzo del Worker in docs/firebase-config.js e ripubblica l'app.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prova in simulazione
        run: node tests/test_worker.mjs
      - name: Controlla i segreti
        id: segreti
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ] && [ -n "$S" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Mancano CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / FIREBASE_SA: Worker non pubblicato"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Controlla il gettone Cloudflare
        if: steps.segreti.outputs.ok == 'true'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # tollera spazi/a capo o l'indirizzo intero incollato al posto del solo codice
          T=$(printf '%s' "$T" | tr -d '[:space:]'); T=${T#Bearer}
          ID=$(printf '%s' "$A" | grep -oiE '[0-9a-f]{32}' | head -1 | tr 'A-F' 'a-f')
          echo "::add-mask::$T"; echo "::add-mask::$ID"
          if [ -z "$ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID non contiene un Account ID (32 caratteri 0-9 a-f)"; exit 1; fi
          [ "$ID" != "$(printf '%s' "$A" | tr -d '[:space:]')" ] && echo "Nota: l'Account ID salvato conteneva altro oltre al codice (sistemato in automatico)"
          echo "CF_TOKEN=$T" >> "$GITHUB_ENV"; echo "CF_ACCOUNT=$ID" >> "$GITHUB_ENV"
          j() { jq -c '{success, status: .result.status, subdomain: .result.subdomain, errors: [.errors[]? | "\(.code) \(.message)"]}' 2>/dev/null || echo "(risposta non leggibile)"; }
          echo "Gettone personale: $(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | j)"
          echo "Gettone dell'account: $(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$ID/tokens/verify" | j)"
          echo "Lettura Worker dell'account: $(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$ID/workers/scripts" | j)"
          echo "Sottodominio workers.dev: $(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$ID/workers/subdomain" | j)"
          exit 0
      - name: Pubblica su Cloudflare
        id: deploy
        if: steps.segreti.outputs.ok == 'true'
        working-directory: worker
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"
          npx -y wrangler@4.45.0 deploy 2>&1 | tee /tmp/deploy.txt
          printf '%s' "$FIREBASE_SA" | npx -y wrangler@4.45.0 secret put FIREBASE_SA
          echo "url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' /tmp/deploy.txt | head -1)" >> "$GITHUB_OUTPUT"
      - name: Collega l'app al Worker
        if: steps.segreti.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          u="$URL"
          echo "Indirizzo del Worker: ${u:-sconosciuto}"
          [ -z "$u" ] && exit 0
          sleep 5
          echo "Risposta del Worker: $(curl -s "$u")"
          if grep -q "notifyUrl = \"$u\"" docs/firebase-config.js; then echo "App già collegata"; exit 0; fi
          sed -i "s|^export const notifyUrl = .*|export const notifyUrl = \"$u\";|" docs/firebase-config.js
          git config user.name "Robot Rimineser"
          git config user.email "robot@users.noreply.github.com"
          git add docs/firebase-config.js
          git commit -m "App collegata al robot notifiche Cloudflare"
          git pull --rebase -q && git push
          gh workflow run uisp.yml --ref main   # ripubblica l'app
