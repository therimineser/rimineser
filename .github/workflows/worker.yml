name: Robot notifiche Cloudflare

# Pubblica worker/ su Cloudflare Workers (piano gratuito) e gli passa la chiave Firebase.
# Segreti del repository necessari: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (e FIREBASE_SA, già presente).
# Al primo avvio scrive da solo l'indirizzo del Worker in docs/firebase-config.js e ripubblica l'app.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prova in simulazione
        run: node tests/test_worker.mjs
      - name: Controlla i segreti
        id: segreti
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ] && [ -n "$S" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Mancano CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / FIREBASE_SA: Worker non pubblicato"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Pubblica su Cloudflare
        id: deploy
        if: steps.segreti.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            FIREBASE_SA
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: Collega l'app al Worker
        if: steps.segreti.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          OUT: ${{ steps.deploy.outputs.command-output }}
          GH_TOKEN: ${{ github.token }}
        run: |
          u="$URL"
          [ -z "$u" ] && u=$(printf '%s' "$OUT" | grep -o 'https://[a-z0-9.-]*\.workers\.dev' | head -1)
          echo "Indirizzo del Worker: ${u:-sconosciuto}"
          [ -z "$u" ] && exit 0
          code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
          echo "Risposta del Worker: $code"
          if grep -q "notifyUrl = \"$u\"" docs/firebase-config.js; then echo "App già collegata"; exit 0; fi
          sed -i "s|^export const notifyUrl = .*|export const notifyUrl = \"$u\";|" docs/firebase-config.js
          git config user.name "Robot Rimineser"
          git config user.email "robot@users.noreply.github.com"
          git add docs/firebase-config.js
          git commit -m "App collegata al robot notifiche Cloudflare"
          git pull --rebase -q && git push
          gh workflow run uisp.yml --ref main   # ripubblica l'app
