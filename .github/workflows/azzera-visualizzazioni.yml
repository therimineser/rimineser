name: Azzera visualizzazioni

# Solo a mano (o da Claude su richiesta dell'amministratore): cancella i contatori stats/views-* in Firebase.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  azzera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Azzera i contatori
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          python3 -m pip install -q --disable-pip-version-check --user --break-system-packages google-auth requests 2>/dev/null \
            || python3 -m pip install -q --disable-pip-version-check --user google-auth requests
          python3 tools/azzera_visualizzazioni.py
